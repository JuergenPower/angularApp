<div class="status-content">
  <div class="portrait-container">
    <div class="portrait-frame">
      <img
        class="character-portrait"
        [src]="'images/player-character-' + level() + '.png'"
        alt="Spielfigur des aktuellen Levels"
      />
    </div>
  </div>
  <table class="game-status-table" aria-label="Spielstatus">
    <colgroup>
      <col />
      <col />
    </colgroup>
    <tbody>
      <tr>
        <th scope="row">Level:</th>
        <td>
          <select
            aria-label="Level"
            (change)="changeLevel($event)">
            @for (option of levelOptions(); track option.value) {
              <option
                [value]="option.value"
                [selected]="option.value === level()"
              >
                {{ option.label }}
              </option>
            }
          </select>
        </td>
      </tr>
    </tbody>
    <tbody>
      <tr>
        <th scope="row">
          <img class="money-icon" src="images/dollar-bills.png" alt="Geld" />
        </th>
        <td
          class="money-value"
          [class.money-increased]="moneyIncreased()"
        >
          {{ money() }} €
        </td>
      </tr>
    </tbody>
  </table>
</div>
