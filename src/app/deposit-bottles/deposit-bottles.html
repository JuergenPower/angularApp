<h2>Pfandflaschen sammeln</h2>
<p>Gesammelte Flaschen: {{ bottleCount() }} / {{ bottleMaxCount() }}</p>
<button
  type="button"
  [disabled]="isBusy()"
  (click)="redeemBottles()"
>
  Pfand abholen
</button>

<div
  class="meadow"
  [style.height.px]="meadowHeight"
  [style.max-width.px]="meadowMaxWidth"
>
  <button
    type="button"
    [disabled]="isBusy() || bottleCount() >= bottleMaxCount()"
    [style.grid-row]="buttonPosition().row"
    [style.grid-column]="buttonPosition().column"
    (click)="collectBottle()"
  >
    Flasche
  </button>
</div>

@if (isBusy()) {
  <p role="status">
    @if (activeAction() === 'redeeming') {
      Pfand wird abgeholt …
    } @else {
      Flasche wird eingesammelt …
    }
  </p>
  <div class="action-progress" aria-hidden="true">
    <div
      class="action-progress__fill"
      [style.animation-duration.ms]="activeActionDurationMs()"
    ></div>
  </div>
}
