<div class="game-layout">
  <aside class="game-sidebar" aria-label="Spielstatus">
    <app-game-status [money]="money()" [level]="currentLevel()" />
  </aside>

  <main class="game-level">
    @if (currentLevel() === 'level-1') {
      <app-level-1
        [money]="money()"
        (earnMoney)="addMoney($event)"
        (purchaseRequested)="spendMoney($event)"
      />
    } @else if (currentLevel() === 'level-3') {
      <app-level-3
        [money]="money()"
        (earnMoney)="addMoney($event)"
        (purchaseRequested)="spendMoney($event)"
      />
    }
    <router-outlet />
  </main>
</div>
