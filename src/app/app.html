<div class="game-layout">
  <aside class="game-sidebar" aria-label="Spielstatus">
    <app-game-status
      [money]="money()"
      [level]="currentLevel()"
      [levelOptions]="unlockedLevels()"
      (levelChange)="currentLevel.set($event)"
    />
  </aside>

  <main class="game-level">
    @if (currentLevel() === 'level-1') {
      <app-level-1
        [money]="money()"
        (earnMoney)="addMoney($event)"
        (purchaseRequested)="spendMoney($event)"
        (unlockLevel)="unlockLevel($event)"
      />
    } @else if (currentLevel() === 'level-2') {
      <p>Level 2 ist freigeschaltet und wird bald spielbar.</p>
    } @else if (currentLevel() === 'level-3') {
      <app-level-3
        [money]="money()"
        (earnMoney)="addMoney($event)"
        (purchaseRequested)="spendMoney($event)"
      />
    }
    <router-outlet />
  </main>
</div>
